<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="cover-title cover-desc">
  <title id="cover-title">Aletheia cover motif</title>
  <desc id="cover-desc">Editorial Greek-antiquity illustration for Aletheia: classical marble relief, bronze accents, scroll and seal audit symbols, no text or data.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F1B2E"/>
